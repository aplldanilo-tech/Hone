# Caminho do arquivo no Acode: .github/workflows/maven.yml
name: Robô de Build Maven

on:
  push:
    branches: [ "main", "master" ] # Ativa o robô sempre que você mandar o código do Acode

jobs:
  build-e-mcp:
    runs-on: ubuntu-latest # Liga um computador Linux potente na nuvem do GitHub de graça

    steps:
    - name: 1. Abrindo e mapeando a pasta do código
      uses: actions/checkout@v4

    - name: 2. Instalando e configurando o Ambiente Java JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: 'maven'

    - name: 3. Executando o comando MAVEN no código
      run: mvn -B clean install --file pom.xml
